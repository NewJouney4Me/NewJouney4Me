<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 120 590 370" width="590" height="370" role="img" aria-label="A happy shiba inu peeking over a ledge, waving a paw" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EC"/>
      <stop offset="1" stop-color="#FFE9CF"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBB551"/>
      <stop offset="1" stop-color="#F29A2E"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBEFE3"/>
    </linearGradient>
    <clipPath id="mouthClip">
      <path d="M233 348 Q300 362 368 336 C372 385 332 418 291 416 C255 412 232 385 233 348 Z"/>
    </clipPath>
  </defs>

  <!-- card background -->
  <rect x="20" y="120" width="590" height="370" rx="28" fill="url(#bg)"/>
  <circle cx="315" cy="330" r="150" fill="#FFD9A8" opacity="0.45"/>

  <!-- confetti / sparkles -->
  <g>
    <path d="M92 190 l5 -14 5 14 14 5 -14 5 -5 14 -5 -14 -14 -5z" fill="#FFC857">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M548 205 l4 -11 4 11 11 4 -11 4 -4 11 -4 -11 -11 -4z" fill="#FF9AA8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M520 150 l3 -8 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3z" fill="#FFC857">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <circle cx="70" cy="300" r="6" fill="#FF9AA8" opacity="0.7"/>
    <circle cx="585" cy="320" r="5" fill="#9ED8C6" opacity="0.8"/>
    <circle cx="150" cy="150" r="4" fill="#9ED8C6" opacity="0.8"/>
    <circle cx="470" cy="470" r="5" fill="#FFC857" opacity="0.8"/>
    <circle cx="120" cy="470" r="4" fill="#FF9AA8" opacity="0.7"/>
  </g>

  <g stroke-linejoin="round" stroke-linecap="round">

    <!-- head + ears -->
    <path d="M185 418 C165 395 160 360 163 330 L140 243 Q170 238 207 255 C240 232 285 220 330 214 L372 174 Q381 176 385 184 L418 247 C435 262 447 280 447 300 L440 418 Z"
          fill="url(#fur)" stroke="#6A3B2A" stroke-width="5"/>

    <!-- inner ears -->
    <path d="M154 264 L197 268 L169 312 Z" fill="#FBD28A" stroke="#6A3B2A" stroke-width="3"/>
    <path d="M346 218 L372 190 L398 233 Z" fill="#FBD28A" stroke="#6A3B2A" stroke-width="3"/>

    <!-- white muzzle -->
    <path d="M196 418 C190 380 200 345 235 325 C255 313 262 292 280 290 C305 288 330 310 372 330 L385 418 Z" fill="url(#white)"/>

    <!-- brow dots -->
    <ellipse cx="233" cy="272" rx="11" ry="7" fill="#FFFFFF" transform="rotate(-12 233 272)"/>
    <ellipse cx="300" cy="254" rx="11" ry="7" fill="#FFFFFF" transform="rotate(-12 300 254)"/>

    <!-- closed happy eyes -->
    <path d="M222 298 Q237 280 252 298" fill="none" stroke="#6A3B2A" stroke-width="5"/>
    <path d="M308 276 Q323 258 338 276" fill="none" stroke="#6A3B2A" stroke-width="5"/>

    <!-- blush -->
    <ellipse cx="214" cy="334" rx="14" ry="8" fill="#FF9AA8" opacity="0.45"/>
    <ellipse cx="357" cy="322" rx="14" ry="8" fill="#FF9AA8" opacity="0.45"/>

    <!-- mouth -->
    <path d="M233 348 Q300 362 368 336 C372 385 332 418 291 416 C255 412 232 385 233 348 Z" fill="#6F3A2B" stroke="#6A3B2A" stroke-width="5"/>
    <!-- tongue (wiggles), kept inside the mouth -->
    <g clip-path="url(#mouthClip)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="1.1s" repeatCount="indefinite"/>
        <path d="M266 372 C260 405 270 436 293 437 C316 437 326 405 322 366 Z" fill="#F28C98" stroke="#6A3B2A" stroke-width="4"/>
        <path d="M293 392 V415" stroke="#D96A7C" stroke-width="3" fill="none"/>
      </g>
    </g>
    <!-- mouth outline on top -->
    <path d="M233 348 Q300 362 368 336 C372 385 332 418 291 416 C255 412 232 385 233 348 Z" fill="none" stroke="#6A3B2A" stroke-width="5"/>

    <!-- nose -->
    <path d="M249 300 Q272 284 297 300 Q293 323 274 327 Q254 323 249 300 Z" fill="#6F3A2B" stroke="#6A3B2A" stroke-width="4"/>
    <ellipse cx="270" cy="299" rx="9" ry="3.5" fill="#FFFFFF" opacity="0.55" transform="rotate(-8 270 299)"/>
    <path d="M274 327 V346" stroke="#6A3B2A" stroke-width="4" fill="none"/>

    <!-- ground line -->
    <path d="M52 418 H572" stroke="#6A3B2A" stroke-width="5" fill="none"/>

    <!-- waving paw -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 450 418;9 450 418;-5 450 418" dur="1.3s" repeatCount="indefinite"/>
      <path d="M392 418 C392 380 385 350 392 320 C400 292 425 278 448 280 C478 282 490 305 497 340 C503 372 508 395 513 418 Z"
            fill="url(#white)" stroke="#6A3B2A" stroke-width="5"/>
      <!-- main pad -->
      <path d="M423 352 Q425 331 445 336 Q465 331 468 352 Q470 369 445 372 Q421 370 423 352 Z" fill="#F4A1B0"/>
      <path d="M432 345 Q440 339 448 341" stroke="#FFD0D8" stroke-width="3" fill="none"/>
      <!-- toe beans -->
      <ellipse cx="405" cy="327" rx="9" ry="11" fill="#F4A1B0" transform="rotate(-20 405 327)"/>
      <ellipse cx="428" cy="301" rx="10" ry="12" fill="#F4A1B0" transform="rotate(-8 428 301)"/>
      <ellipse cx="456" cy="298" rx="10" ry="12" fill="#F4A1B0" transform="rotate(6 456 298)"/>
      <ellipse cx="483" cy="326" rx="9" ry="11" fill="#F4A1B0" transform="rotate(22 483 326)"/>
    </g>

    <!-- resting paw on the ledge -->
    <path d="M118 410 C112 385 135 370 168 372 C200 372 225 385 222 415 C220 440 190 455 165 452 C135 450 120 435 118 410 Z"
          fill="url(#white)" stroke="#6A3B2A" stroke-width="5"/>
    <path d="M160 436 Q163 446 170 450" fill="none" stroke="#6A3B2A" stroke-width="3.5"/>
    <path d="M186 438 Q187 446 192 449" fill="none" stroke="#6A3B2A" stroke-width="3.5"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
